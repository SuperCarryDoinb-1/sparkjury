run_id = "node-real-samples"
db = "runs/node-real-samples/sparkjury.db"
reset_db = true
[[inputs]]
path = "data/samples/tau2_retail_sample.json"
source = "tau2"
[[inputs]]
path = "data/samples/otel_sample.json"
source = "otel"
[panel]
# 每个裁判同时在飞的请求数（不是面板总数）。面板里每个裁判是一个独立端点，能扛几路是那个
# 端点的属性：真批实测 Qwen3-30B-FP8 从 1 路加到 4 路解码只从 24 涨到 29 tok/s，而
# Nemotron-NVFP4 能到 150 tok/s。同一块 GB10 上全局开 6 路时，judge_a 单条判定中位 18.9s、
# judge_b 10.7s；全局 1 路时 3.7s / 3.0s，而整段 SCORE 只慢 1.31 倍。默认 1 路保住延迟，
# 需要吞吐的裁判单独开高。
workers = 1
# Prompt budget. The tightest judge context on the node is 16k tokens (Nemotron); 45k
# characters is roughly 11k tokens, which leaves room for the rubric and the answer.
# Every step keeps its `[n]` line so evidence_steps stay citable.
transcript_width = 4000
transcript_max_chars = 45000
include_gold = false       # never hand a judge the benchmark's own verdict
[[panel.judges]]
name = "judge_a"
kind = "openai"
model = "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
base_url = "http://127.0.0.1:8001/v1"
timeout_s = 120
extra_body = { chat_template_kwargs = { enable_thinking = false } }
[[panel.judges]]
name = "judge_b"
kind = "openai"
model = "nvidia/Nemotron-3.5-Lightning-30B-A3B-NVFP4"
base_url = "http://127.0.0.1:8002/v1"
timeout_s = 120
# 这个端点解码速度随并发涨得动（NVFP4 权重只有 FP8 的一半），要吞吐可以开：
# concurrency = 2 没量过，concurrency = 4 实测单条中位 10.2 秒、8 条 SCORE 快 10%。
# 默认跟 [panel] workers 走（1 路，单条 3.0 秒），先保住 M3 的「单条 10 秒」这条线。
extra_body = { chat_template_kwargs = { enable_thinking = false } }
[[panel.judges]]
name = "judge_c"
kind = "openai"
model = "step-3.7-flash"
base_url = "https://api.stepfun.com/v1"
api_key_env = "STEPFUN_API_KEY"
timeout_s = 60
concurrency = 4            # 云端，不占本地 GPU，瓶颈是网络往返
# step-3.7-flash 是思维模型：输出预算被推理吃光时 content 是空串，判定直接废掉。真批实测
# （max_tokens=1200、同一条 prompt 重跑 8 次）：6 次 content 0 字、finish_reason=length，
# 8 条 trace 的 32 个维度废掉 17 个；给到 4000 后 32 个维度只剩 1 个失手，单次中位 5.2 秒。
max_tokens = 4000
[arbiter]
jev = "auto"
audit_rate = 0.1
[cluster]
embedder = "openai"
embed_base_url = "http://127.0.0.1:8003/v1"
embed_model = "Qwen/Qwen3-Embedding-0.6B"
min_cluster_size = 2
[report]
title = "SparkJury on DGX Spark: real judges, sample traces"
