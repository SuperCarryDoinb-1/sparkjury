# NeMo Agent Toolkit evaluation config that combines NAT's built-in trajectory evaluator with SparkJury.
#   nat eval --config_file nat/configs/sparkjury_eval.yml
# Evaluate a pre-recorded run instead of re-running the workflow:
#   nat eval --config_file nat/configs/sparkjury_eval.yml --skip_workflow --dataset .tmp/nat/sparkjury/workflow_output.json
#
# NAT provides: workflow execution, the trajectory evaluator, the profiler (token/latency/bottleneck analysis).
# SparkJury adds: three judges from three model families, disagreement arbitration (Jev cloud / local), 5% audit,
# and downstream badcase clustering + evidence cards (run `sparkjury` on the same traces).

llms:
  judge_a_qwen:
    _type: openai
    model_name: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
    base_url: http://127.0.0.1:8001/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 600
  agent_under_test:
    _type: openai
    model_name: Qwen/Qwen3-8B
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0

workflow:
  # Replace with the workflow under test, e.g. a retail customer-service agent built with NAT.
  _type: react_agent
  llm_name: agent_under_test
  tool_names: []
  verbose: true

eval:
  general:
    output_dir: ./.tmp/nat/sparkjury
    max_concurrency: 4
    dataset:
      _type: json
      file_path: nat/data/retail_questions.json
    profiler:
      compute_llm_metrics: true
      csv_exclude_io_text: true
      bottleneck_analysis:
        enable_simple_stack: true
  evaluators:
    trajectory:
      _type: trajectory
      llm_name: judge_a_qwen
    sparkjury:
      _type: sparkjury
      judges: deploy/judges.toml      # three judges, three families; "mock" for offline
      dimensions: [outcome, tool_use, efficiency, safety]
      jev: auto
      audit_rate: 0.05
