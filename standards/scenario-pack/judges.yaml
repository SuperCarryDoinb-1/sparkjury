# judges.yaml — 裁判配置（scenario pack 策略数据）
# 红线 1：被评 agent 模型不得与任一裁判同族（JudgeBench：同族自评准确率 64%→45%）。
# 红线 2：仲裁方可降级，降级必须进 run manifest 的 degraded_flags。

meta:
  version: 0.1.0
  panel_principle: "跨模型族。同名族=同票数坍缩（Nine Judges: 有效独立票约2票）"

judges:
  - id: judge_a
    family: qwen
    model: "Qwen3-30B-A3B"
    runtime: "local_vllm"        # DGX Spark，vLLM 指本地端点
    quant: "int4"
    role: "主力裁判 + 仲裁降级兜底"
  - id: judge_b
    family: gemma
    model: "Gemma-4-12B"
    runtime: "local_vllm"
    quant: "bf16"
    role: "独立裁判"
  - id: judge_c
    family: step
    model: "Step-3.7-Flash"
    runtime: "local_vllm"        # 显存不足时 runtime 切 stepfun_api，manifest 标 judge_c_api_fallback
    quant: "auto"
    role: "独立裁判（赛事要求 StepFun 模型在场，此位置必须存在）"

embedding:
  model: "local_embedding"       # 本地 embedding，具体模型名在部署态 pin
  runtime: "local"

arbiter:
  primary:
    type: jev
    endpoint: "api.typesafe.ai/v1/systemone"   # 云 API；不开源无权重，装不进 DGX
    cost_note: "$0.04/百万输入 token，输出免费"
  fallback:
    type: judge_a
    degraded_flag: "jev_unreachable"

lead_judge_selection: "由 calibrate 产出的裁判可靠性画像决定，不写死"
judged_agent_forbidden_families: ["qwen", "gemma", "step"]   # 被评 agent 默认 demo 选型须避开
