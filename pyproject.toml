[project]
name = "sparkjury"
version = "0.1.0"
description = "Agent evaluation harness for DGX Spark: multi-judge scoring, arbitration, badcase clustering, evidence cards."
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
sparkjury = "sparkjury.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]
# optional helpers for talking to the DGX node and taking screenshots; work on Windows, macOS and Linux
ops = [
    "paramiko>=3.4",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkjury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
