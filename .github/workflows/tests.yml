name: tests

# 大家都在 GitHub 上一起做，所以红绿要落在 PR 上。三套系统各跑一遍是有原因的：
# 这个仓库踩过 macOS 自带 bash 3.2 解析不了 heredoc、Windows 换行符混进测试扫描这类坑，
# 只在某一个人的笔记本上绿，说明不了队友那里也能跑。节点是 aarch64，不在这里跑。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 装依赖
        run: uv sync --group ops

      - name: 跑测试
        run: uv run pytest -q
